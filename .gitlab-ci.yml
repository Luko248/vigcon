image: oven/bun:1

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .bun/

build:
  stage: build
  script:
    - bun install
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

pages:
  stage: deploy
  script:
    # GitLab Pages requires the output directory to be named "public"
    # We remove the source public directory (if present in checkout) and move dist to public
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
